name: obra_check
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  pdf: ^3.11.1
  printing: ^5.13.4
  path_provider: ^2.1.5
  share_plus: ^10.1.2
  archive: ^3.6.1
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  open_filex: ^4.7.0
  firebase_core: ^3.15.1
  firebase_auth: ^5.3.3
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.6.10
  firebase_storage: ^12.4.10
  url_launcher: ^6.3.1
  http: ^1.2.2
  package_info_plus: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
